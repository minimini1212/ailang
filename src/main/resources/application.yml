spring:
  application:
    name: ailang

  datasource:
    # 🔴 주소도 설정이다. 계정·비번만 환경변수이고 주소만 리터럴이면, 배포할 때
    #    「비밀은 잘 뺐는데 접속은 여전히 내 PC 로 간다」가 된다.
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    # 🔴 기본값을 false 로 둔다. 켜면 실행 SQL 이 «바인딩 값과 함께» 로그로 흐르는데,
    #    그 안에 학생 이메일·답안이 들어 있다. 개발 중 필요하면 .env 에서 켠다.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_EMAIL}
    password: ${GOOGLE_EMAIL_SECRET_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_SECRET_KEY}
            scope: email, profile
            # ⚠️ 이건 «백엔드 자신» 의 콜백 주소다. 아래 app.frontend.origin 과 성격이 다르다.
            redirect-uri: "${APP_OAUTH2_CALLBACK_BASE:http://localhost:8080}/login/oauth2/code/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account #매번 계정 선택 화면 표시

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8001}

data:
  loader:
    # 문제 데이터가 이미 있으면 자동으로 건너뜀 (중복 적재 없음)
    enabled: ${DATA_LOADER_ENABLED:true}
    # 🔴 절대 경로를 여기 박지 않는다 — 사람마다 다른 값이므로 .env 에서 받는다.
    #    예전에 C:/Users/USER/OneDrive/... 가 박혀 있어서, 클론한 다른 PC 는 전부
    #    문제 0건으로 떴다. 키 목록의 진실: .env.example ⑦ · docs/DATA_CONTRACT.md §6
    problem-dir: ${DATA_PROBLEM_DIR:}
    answer-dir: ${DATA_ANSWER_DIR:}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600000
  refresh-expiration: 604800000

app:
  # 🎯 프론트 주소의 «정본» 은 여기 하나다.
  #    종전에는 SecurityConfig(CORS) 와 아래 redirect-uri 두 곳에 localhost:5173 이
  #    각각 박혀 있어서, 한쪽만 고치면 「로그인은 되는데 화면이 못 받는」 상태가 됐다.
  frontend:
    origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}
  oauth2:
    redirect-uri: ${APP_FRONTEND_ORIGIN:http://localhost:5173}/oauth2/callback
  mail:
    verification-code-ttl: 300
