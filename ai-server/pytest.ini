[pytest]
testpaths = tests
# 비동기 검사에 매번 표시를 붙이지 않아도 되게 한다.
asyncio_mode = auto
filterwarnings =
    # 🔄 app/config.py 의 class Config 는 pydantic v1 방식이다. 옮기는 것은 별도 작업이라
    #    (TODOS 4절) 지금은 경고만 숨긴다. 🔴 다른 경고는 숨기지 않는다 — 새 경고가
    #    묻히면 이 줄이 다음 사람을 속인다.
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
