services:
  oracle:
    image: gvenzl/oracle-free
    container_name: oracle23ai
    environment:
      ORACLE_PASSWORD: oracle
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - ailang-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ailang-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - ailang-network
    restart: unless-stopped

  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: ailang-ai-server
    env_file:
      - ./.env
    ports:
      - "8001:8000"
    depends_on:
      - redis
    networks:
      - ailang-network
    restart: unless-stopped
    # 개발 중 자동 재시작이 필요할 때만 아래 두 줄을 켠다.
    # ⚠️ 소스 마운트가 «같이» 있어야 의미가 있다 — 이미지는 소스를 구워서 갖고 있다.
    # volumes:
    #   - ./ai-server:/app
    # command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  oracle-data:
  redis-data:

networks:
  ailang-network:
    driver: bridge
